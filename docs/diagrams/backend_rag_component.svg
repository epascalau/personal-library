  <text x="52" y="52" font-size="23" font-weight="800" fill="#f8fafc">Personal Library — Backend RAG Component Interaction</text>
  <text x="52" y="74" font-size="12" font-weight="500" fill="#94a3b8">Spring AI sits between the services and the engines, so models and vector stores swap by configuration alone</text>
  <rect x="1594" y="38" width="200" height="28" rx="6" fill="#0070f2" />
  <text x="1694" y="57" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Component / Data Flow</text>

  <rect x="34" y="118" width="1752" height="120" rx="9" fill="#1e293b" fill-opacity="0.38" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="7 4" />
  <text x="50" y="139" font-size="12" font-weight="800" fill="#38bdf8">API LAYER — controllers</text>
  <rect x="34" y="300" width="1752" height="150" rx="9" fill="#1e293b" fill-opacity="0.38" stroke="#34d399" stroke-width="1.5" stroke-dasharray="7 4" />
  <text x="1180" y="321" font-size="12" font-weight="800" fill="#34d399">SERVICE LAYER — orchestration (no concurrency in the upload path)</text>
