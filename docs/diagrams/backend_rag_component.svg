    <text x="820" y="827" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">MongoDB :27017</text>
    <text x="820" y="846" font-size="10.5" fill="#fbbf24" text-anchor="middle">DocumentEntity</text>
  </g>
  <g>
    <rect x="970" y="800" width="240" height="62" rx="7" fill="#4a2f10" stroke="#fbbf24" stroke-width="1.5" filter="url(#cmp-shadow2)" />
