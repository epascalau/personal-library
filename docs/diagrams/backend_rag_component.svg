  <text x="1240" y="551" font-size="12" font-weight="800" fill="#c084fc">SPRING AI ABSTRACTION — swappable beans from OllamaConfig</text>
  <rect x="34" y="760" width="1752" height="178" rx="9" fill="#1e293b" fill-opacity="0.38" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="7 4" />
  <text x="1380" y="781" font-size="12" font-weight="800" fill="#fbbf24">INFRASTRUCTURE — docker compose services</text>

  <g>
