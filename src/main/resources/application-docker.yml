spring:
  # Spring Boot 4: property prefix moved from "spring.data.mongodb" to "spring.mongodb"
  mongodb:
    uri: mongodb://root:librarypass@mongodb:27017/personal_library?authSource=admin

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/personal-library-realm
          jwk-set-uri: http://keycloak:8080/realms/personal-library-realm/protocol/openid-connect/certs

  ai:
    ollama:
      # Connects to the containerized Ollama instance on the shared Docker bridge network
      base-url: http://ollama:11434
    vectorstore:
      qdrant:
        host: qdrant
        port: 6334
        # Must stay true: nothing else provisions the collection. This compose
        # stack runs exactly one backend replica, so the multi-instance DDL race
        # this was once set to false for cannot occur. With it disabled, every
        # index call failed with "Collection `personal_library_embeddings`
        # doesn't exist!", which VectorRagService catches and logs as a warning —
        # uploads still returned 200 while Qdrant stayed empty, so documents were
        # visible in the UI but contributed nothing to retrieval.
        initialize-schema: true

app:
  storage:
    upload-dir: /app/storage/documents
  openapi:
    spec-path: /app/openapi.yaml
