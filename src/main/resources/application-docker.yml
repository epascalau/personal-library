spring:
  # Spring Boot 4: property prefix moved from "spring.data.mongodb" to "spring.mongodb"
  mongodb:
    uri: mongodb://root:librarypass@mongodb:27017/personal_library?authSource=admin

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/personal-library-realm
          jwk-set-uri: http://keycloak:8080/realms/personal-library-realm/protocol/openid-connect/certs

  ai:
    ollama:
      # Connects to the containerized Ollama instance on the shared Docker bridge network
      base-url: http://ollama:11434
    vectorstore:
      qdrant:
        host: qdrant
        port: 6334
        # Schema initialization is disabled in Docker to prevent DDL collisions during
        # concurrent multi-instance orchestration; collection is provisioned beforehand.
        initialize-schema: false

app:
  storage:
    upload-dir: /app/storage/documents
