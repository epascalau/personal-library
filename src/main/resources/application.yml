server:
  port: 18080

spring:
  application:
    name: personal-library-backend

  # Spring Boot 4 moved Mongo autoconfiguration into its own "spring-boot-mongodb" module and
  # renamed the property prefix from "spring.data.mongodb" to "spring.mongodb" (the old prefix is
  # a hard (error-level) deprecation and is silently ignored, not just a soft alias).
  mongodb:
    uri: mongodb://${MONGODB_USER:root}:${MONGODB_PASSWORD:librarypass}@${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/personal_library?authSource=admin

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Spring Security / Keycloak OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/personal-library-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/personal-library-realm/protocol/openid-connect/certs}

  # Spring AI Configuration for Ollama & Qdrant
  # ARCHITECTURAL RATIONALE:
  # - ollama.base-url: Connects Spring AI chat/embedding clients to the Ollama container daemon.
  # - chat.options.temperature (0.3): Balanced global default. Llama is overridden to 0.2 in
  #   OllamaConfig.java for deterministic citation verifiability; Mistral uses 0.3 for fluency.
  # - embedding.options.model (nomic-embed-text): 768-dim embeddings with 8k context window,
  #   yielding superior semantic cluster density over traditional 384-dim sentence transformers.
  # - vectorstore.qdrant.port (6334): Connects via gRPC for high-performance binary protocol transfer.
  # - initialize-schema (true): Automatically creates the collection if it is absent.
  #   Enabled in both profiles — nothing else provisions it, and the compose stack runs
  #   a single backend replica, so there is no concurrent-DDL race to avoid.
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          temperature: 0.3
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        collection-name: personal_library_embeddings
        use-tls: false
        initialize-schema: true

# Physical storage and dual-model selection
# Llama 3.2/3.3 provides technical citation grounding; Mistral provides executive synthesis.
app:
  storage:
    upload-dir: ${STORAGE_DIR:./storage/documents}
  models:
    llama: ${OLLAMA_LLAMA_MODEL:llama3.2}
    mistral: ${OLLAMA_MISTRAL_MODEL:mistral}

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.personallibrary: DEBUG
    org.springframework.ai: INFO
    org.springframework.security: INFO
