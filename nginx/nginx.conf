# =============================================================================
# Personal Library - Enterprise Reverse Proxy (Single Ingress)
# =============================================================================
# WHAT: Terminates all inbound traffic on a single port and routes it to the
# two application runtimes bundled in the personal-library-app container:
#   - /api/v1/*  -> Java Spring Boot (port 18080)   — the real, persistent backend
#   - everything else -> Node/Express gateway (port 13000) — static frontend assets
#     and the in-memory "Integrated"/mock backend target used for demos & tests
#
# WHY (enterprise rationale):
#   1. Single ingress: only ONE port needs to be opened on a firewall/load
#      balancer, instead of exposing two independently-versioned runtimes
#      directly to the network.
#   2. Same-origin API calls: the frontend and the Java API are now served
#      from the same origin (same host:port), which lets the backend's CORS
#      policy be tightened from "allow any origin" down to "same-origin only"
#      in environments that route exclusively through this proxy.
#   3. Centralized hardening: TLS termination, security headers, gzip, request
#      size limits and timeouts are enforced in exactly one place instead of
#      being duplicated (or forgotten) in both runtimes.
#   4. Topology hiding: internal container ports/hostnames are never exposed
#      to the browser or to the outside network.
#
# NOTE: direct access to :13000/:18080 remains available on the Docker host for
# local development and for testing the "Direct Java Spring Boot" backend
# target in the UI's Backend Settings dialog. This proxy is the RECOMMENDED
# production ingress, not the only path — see docker-compose.yml comments.
# The host-published ingress port is deliberately 8088 (not the standard 80)
# so this educational stack never collides with another local web server.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Upload bodies are real PDFs/DOCX sent as multipart/form-data; keep this
    # generous (matches the Express JSON body limit used by the mock backend)
    # so legitimate large documents are never rejected at the proxy layer.
    client_max_body_size 50m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Baseline security headers applied to every response proxied through
    # this ingress, regardless of which upstream runtime served the request.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    upstream java_backend {
        server personal-library-app:18080;
    }

    upstream node_gateway {
        server personal-library-app:13000;
    }

    upstream swagger_editor {
        server swagger-editor:80;
    }

    server {
        listen 80;
        server_name _;

        # --- Real Java Spring Boot API ---------------------------------------
        # Matches the contract exercised by RestBackendAdapter.ts: JSON bodies,
        # multipart file uploads, and long-running LLM-backed endpoints.
        location /api/v1/ {
            proxy_pass http://java_backend/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Document upload chains up to THREE sequential Ollama calls in one
            # request (BibTeX extraction, then Llama summary, then Mistral
            # summary — see DocumentService.uploadDocument()), each of which may
            # legitimately take up to the Java backend's per-call Ollama read
            # timeout (OllamaConfig.OLLAMA_READ_TIMEOUT, 10 minutes). This proxy
            # timeout must exceed the SUM of those calls, matching the frontend's
            # LLM_TIMEOUT_MS budget (35 minutes = 3x10min + 5min buffer), with a
            # small margin so nginx is never the first layer to cut the
            # connection out from under a model that is still genuinely working.
            proxy_connect_timeout 10s;
            proxy_send_timeout    2160s;
            proxy_read_timeout    2160s;
        }

        # Spring Boot Actuator health/readiness, proxied for uniform
        # monitoring through the single ingress port.
        location /actuator/ {
            proxy_pass http://java_backend/actuator/;
            proxy_set_header Host $host;
        }

        # --- Swagger Editor: live openapi.yaml viewer/editor -----------------
        # Trailing slash on proxy_pass strips the /swagger prefix so the
        # Editor SPA (which expects to be served from "/") still resolves
        # its own assets correctly behind this sub-path.
        location /swagger/ {
            proxy_pass http://swagger_editor/;
            proxy_set_header Host $host;
        }

        # --- Frontend bundle & mock/"Integrated" backend ---------------------
        # Everything else (the SPA shell, static assets, and the Node-hosted
        # mock API routes under /api/v1 served when selecting the "Integrated"
        # backend target) is proxied to the Node/Express gateway.
        location / {
            proxy_pass http://node_gateway/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Matches the API location's budget: the Node gateway's own mock
            # backend simulates the same long-running upload/summarization
            # flows for the "Integrated" preset and must not be cut off early.
            proxy_connect_timeout 10s;
            proxy_send_timeout    2160s;
            proxy_read_timeout    2160s;
        }
    }
}
