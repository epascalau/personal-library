services:
  # ==============================================================================
  # Personal Library Web Application & Java Spring Boot Service
  # ==============================================================================
  personal-library-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-library-app
    restart: unless-stopped
    ports:
      - "13000:13000"
      - "18080:18080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=mongodb://root:librarypass@mongodb:27017/personal_library?authSource=admin
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_LLAMA_MODEL=${OLLAMA_LLAMA_MODEL:-llama3.2}
      - OLLAMA_MISTRAL_MODEL=${OLLAMA_MISTRAL_MODEL:-mistral}
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=personal-library-realm
      - KEYCLOAK_CLIENT_ID=personal-library-client
      - KEYCLOAK_CLIENT_SECRET=enterprise-library-secret
    volumes:
      - library_storage:/app/storage/documents
    healthcheck:
      # Both runtimes must answer before the stack counts as deployed: the Node
      # gateway on 13000 and the Spring Boot service on 18080.
      test: ["CMD-SHELL", "curl -fsS http://localhost:13000/ > /dev/null && curl -fsS http://localhost:18080/actuator/health > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
      keycloak:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - library-net

  # ==============================================================================
  # Swagger Editor: Interactive OpenAPI 3.0 Contract Viewer/Editor
  # ==============================================================================
  # WHAT: Serves the official Swagger Editor SPA pre-loaded with this project's
  # `openapi.yaml`, so the REST contract can be browsed, validated, and edited
  # live in a syntax-highlighted UI instead of reading the raw YAML file.
  # WHY: The OpenAPI contract is maintained by hand (not generated from the Java
  # controllers), so a quick visual lint/preview tool materially reduces drift
  # between the spec and the running backend. Mounting the real repo file
  # read-only (rather than copying it into the image) means edits made in the
  # Editor's "Download" action are easy to diff back against source control,
  # and the preview always reflects the current file on disk without a rebuild.
  # ==============================================================================
  swagger-editor:
    image: swaggerapi/swagger-editor:v5.8.10
    container_name: personal-library-swagger-editor
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      # Mounted onto the editor's own static web root (NOT /tmp + SWAGGER_FILE,
      # which this nginx-based v5.x image does not actually wire up despite
      # older docs) so the spec is served same-origin at /openapi.yaml,
      # avoiding any CORS issues and working identically whether reached
      # directly on :8090 or proxied through nginx at /swagger/.
      - ./openapi.yaml:/usr/share/nginx/html/openapi.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - library-net

  # ==============================================================================
  # Nginx: Enterprise Single Ingress & Reverse Proxy
  # ==============================================================================
  # WHAT: Fronts both application runtimes (Node/Express on 13000, Java Spring
  # Boot on 18080) behind one published port, routing /api/v1/* to the Java
  # backend and everything else to the Node gateway/frontend bundle.
  # WHY: A single hardened ingress point is standard enterprise practice —
  # it enables same-origin API calls (so the backend's CORS policy can be
  # tightened), centralizes TLS termination/security headers/gzip/timeouts,
  # and avoids exposing internal runtime ports directly to the network.
  # See nginx/nginx.conf for the full routing and rationale.
  #
  # NOTE: :13000 and :18080 remain published on the host for local development
  # and for exercising the "Direct Java Spring Boot" backend target in the
  # UI's Backend Settings dialog; this proxy is the recommended production
  # ingress, not a replacement for those direct dev-time connections. The
  # host-published port is deliberately 8088 (not the standard 80) so this
  # educational stack never collides with another local web server already
  # bound to port 80.
  # ==============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: personal-library-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      personal-library-app:
        condition: service_healthy
      swagger-editor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - library-net

  # ==============================================================================
  # MongoDB: Primary NoSQL Store for Document Metadata & Audit Logs
  # ==============================================================================
  # NOTE: Host-published on 37017, not MongoDB's standard 27017, so this
  # educational stack never collides with a MongoDB instance a learner may
  # already have installed/running locally. Internal container-to-container
  # traffic (Spring Boot app, mongo-express) still uses the real default
  # 27017 against the `mongodb` service name, unaffected by this remap.
  mongodb:
    image: mongo:7.0
    container_name: personal-library-mongodb
    restart: unless-stopped
    ports:
      - "37017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=librarypass
      - MONGO_INITDB_DATABASE=personal_library
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - library-net

  # ==============================================================================
  # Mongo Express: Lightweight Web-Based MongoDB Admin UI
  # ==============================================================================
  # WHAT: Serves a browser-based viewer/editor for the `personal_library` MongoDB
  # instance, reusing the same root credentials already defined for `mongodb`.
  # WHY: There is otherwise no web UI for inspecting document metadata, BibTeX
  # fields, version history snapshots, or AI summaries short of the `mongosh`
  # one-liners in README.md — this gives the same visibility with a point-and-
  # click browser tool, mirroring the "System Services" quick-links dialog in
  # the UI's profile popover.
  # ==============================================================================
  mongo-express:
    image: mongo-express:1.0.2
    container_name: personal-library-mongo-express
    restart: unless-stopped
    ports:
      - "8091:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=librarypass
      - ME_CONFIG_MONGODB_AUTH_DATABASE=admin
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/ > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - library-net

  # ==============================================================================
  # Storage Browser: Read-Only Web Viewer for the Uploaded-Documents Volume
  # ==============================================================================
  # WHAT: Serves a plain directory listing of the `library_storage` named volume —
  # the physical bytes written by StorageService, laid out as
  # `{documentGuid}/v{versionNumber}/{originalFileName}`.
  # WHY: MongoDB holds document *metadata* and Qdrant holds *embeddings*, but until
  # now nothing exposed the actual uploaded files. Learners could not confirm that a
  # PDF really landed on disk, nor see how version-isolated subdirectories make every
  # historical revision independently addressable — the mechanism that makes rollback
  # non-destructive. This turns an invisible volume into a clickable, self-explanatory
  # artifact, completing the "System Services" quick-links trio (data / vectors / files).
  #
  # Mounted `:ro` on purpose: the viewer must never be able to delete or mutate a
  # stored asset that a version snapshot or rollback still depends on.
  #
  # No healthcheck: this image is built FROM scratch (a single static Go binary with
  # no shell, wget, or curl), so no in-container probe command can be executed.
  # ==============================================================================
  storage-browser:
    image: halverneus/static-file-server:v1.8.10
    container_name: personal-library-storage-browser
    restart: unless-stopped
    ports:
      - "8092:8080"
    environment:
      # Serve the mount point itself, with directory indexes enabled so each
      # GUID/version folder is navigable rather than returning 404 on a bare path.
      - FOLDER=/web
      - SHOW_LISTING=true
    volumes:
      - library_storage:/web:ro
    networks:
      - library-net

  # ==============================================================================
  # Qdrant: High-Performance Vector Database for Embeddings & Semantic RAG Search
  # ==============================================================================
  # ARCHITECTURAL RATIONALE:
  # 1. Why Qdrant vs pgvector/Elasticsearch:
  #    - Qdrant is implemented in native Rust, offering deterministic microsecond-level
  #      latency for vector search over millions of high-dimensional points.
  #    - Native support for Hierarchical Navigable Small World (HNSW) indexing with
  #      payload filtering allows scoping searches by documentGuid at query-time without
  #      post-filtering penalties or table joins.
  # 2. Port Allocation:
  #    - Port 6333: HTTP REST API used by health checks, debugging, and web dashboards.
  #    - Port 6334: High-throughput gRPC API utilized by the Spring AI Qdrant client
  #      for serialized binary vector streaming, minimizing HTTP serialization overhead.
  #    - Host-published on 16333/16334, not Qdrant's own 6333/6334 defaults, so this
  #      educational stack never collides with a Qdrant instance already running
  #      locally. Internal container-to-container traffic (Spring Boot app) still
  #      uses the real defaults 6333/6334 against the `qdrant` service name.
  # 3. TLS Setting (QDRANT__SERVICE__ENABLE_TLS=false):
  #    - Traffic resides strictly within the internal, isolated Docker bridge network (library-net).
  #    - TLS overhead is avoided between trusted internal microservices; edge TLS termination
  #      belongs at the nginx reverse proxy (see the `nginx` service and nginx/nginx.conf),
  #      which is the actual single ingress point for this stack.
  # 4. Persistence:
  #    - Volume 'qdrant_data' persists indexed embeddings across container restarts,
  #      preventing expensive re-embedding of the entire document catalog upon reboot.
  # ==============================================================================
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: personal-library-qdrant
    restart: unless-stopped
    ports:
      - "16333:6333" # HTTP REST API
      - "16334:6334" # gRPC Internal API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_TLS=false
    networks:
      - library-net

  # ==============================================================================
  # Ollama: Local LLM & Embedding Engine (Llama 3.3, Mistral Large, Nomic Embed)
  # ==============================================================================
  # ARCHITECTURAL RATIONALE:
  # 1. Why Local Containerized Inference:
  #    - Complete Data Sovereignty: Sensitive enterprise PDFs, internal documentation,
  #      and BibTeX research papers never leave the customer's on-premises boundary.
  #    - Zero API egress costs and immunity to cloud API rate limits or quota throttling.
  # 2. Model Selection Rationale:
  #    - nomic-embed-text: 768-dimensional dense embeddings with 8,192 token context window.
  #      Outperforms OpenAI text-embedding-ada-002 on MTEB benchmarks and supports asymmetric
  #      prefixing (search_document: vs search_query:) for high-precision vector retrieval.
  #    - llama3.2 / llama3.3 (70B Instruct): Primary analytical reasoning engine. Excels at
  #      strict citation grounding, nuanced logical deduction, and structured JSON output.
  #    - mistral / mistral-large-2411: Secondary executive synthesis engine. Fast, highly fluent,
  #      and cross-lingual; ideal for side-by-side comparative summaries.
  # 3. Dual-Model Synthesis Rationale:
  #    - Eliminates single-model cognitive bias by evaluating content through two distinct
  #      foundational model architectures (Meta Llama vs Mistral AI).
  # 4. Enterprise CA & Corporate Proxy Support:
  #    - Uses custom entrypoint (ollama-entrypoint.sh) to mount corporate CA certificates
  #      from ./certs into /usr/local/share/ca-certificates/ before Ollama daemon boots,
  #      enabling model pulling through TLS-intercepting enterprise proxies (Zscaler, BlueCoat).
  # ==============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: personal-library-ollama
    restart: unless-stopped
    # The stock image starts `ollama serve` directly, leaving no chance to trust
    # a corporate root CA before the first registry call. See ollama-entrypoint.sh.
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-entrypoint.sh"]
    # Pulling models reaches registry.ollama.ai, so this container needs working
    # outbound DNS. Containers inherit the Docker daemon's resolver, which on
    # some corporate hosts is a public one (e.g. 8.8.8.8 via daemon.json) that
    # the network blocks — every pull then dies with "server misbehaving" and the
    # stack silently comes up with no models at all. Set LIBRARY_DNS to the
    # resolver from the host's /etc/resolv.conf to fix it without touching the
    # Docker daemon config. Unset (the default) applies no override.
    dns: ${LIBRARY_DNS:-}
    # Host-published on 21434, not Ollama's own 11434 default, so this
    # educational stack never collides with an Ollama daemon already running
    # locally. Internal container-to-container traffic (Spring Boot app)
    # still uses the real default 11434 against the `ollama` service name.
    ports:
      - "21434:11434"
    volumes:
      - ollama_models:/root/.ollama
      # Enterprise TLS certificates for the corporate proxy & registry fetching.
      # Every *.crt / *.pem dropped into ./certs is trusted automatically.
      - ./certs:/usr/local/share/enterprise-ca:ro
      - ./ollama-entrypoint.sh:/usr/local/bin/ollama-entrypoint.sh:ro
    environment:
      # Enterprise Proxy & SSL Configuration
      - OLLAMA_ORIGINS=*
      - ENTERPRISE_CA_DIR=/usr/local/share/enterprise-ca
      # Models required by the Spring AI backend (chat + embeddings), pulled on
      # first start and then cached in the ollama_models volume.
      - OLLAMA_PRELOAD_MODELS=${OLLAMA_PRELOAD_MODELS:-nomic-embed-text llama3.2 mistral}
      - HTTPS_PROXY=${ENTERPRISE_HTTPS_PROXY:-}
      - HTTP_PROXY=${ENTERPRISE_HTTP_PROXY:-}
      - NO_PROXY=${ENTERPRISE_NO_PROXY:-localhost,127.0.0.1,qdrant,mongodb,keycloak}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - library-net

  # ==============================================================================
  # Keycloak: OpenID Connect (OIDC) Identity Provider & Access Control
  # ==============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: personal-library-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./config/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - library-net

  # ==============================================================================
  # Library Seeder: One-Shot Initial Document Ingestion
  # ==============================================================================
  # WHAT: A short-lived sidecar that waits for the application to report healthy
  # and then ingests two starter documents through the public REST API — every
  # file bundled in ./initial_data, plus "The Wonderful Wizard of Oz" fetched
  # from a public CDN. It exits as soon as both are processed.
  # WHY: A freshly provisioned stack otherwise presents an empty List Report,
  # which makes the RAG chat, dual summaries, and vector search impossible to
  # evaluate without manual setup. Seeding through POST /api/v1/documents (not
  # by writing to Mongo and Qdrant directly) is deliberate: it exercises the
  # real pipeline — Tika extraction, BibTeX metadata, chunking, 768-D embeddings
  # and the Llama/Mistral summaries — so the seeded records behave exactly like
  # user-uploaded ones. A direct database insert would produce documents that
  # appear in the UI but return nothing from semantic retrieval.
  #
  # The script is idempotent (it filters the list report by file name before
  # uploading) so repeated `docker compose up` runs never duplicate records, and
  # every failure path is non-fatal so an offline machine still gets a working
  # stack. Set SEED_ENABLED=false to skip seeding entirely.
  #
  # `restart: "no"` is required: this is a task container, not a service, and
  # the default restart policy would otherwise loop it forever after it exits.
  # ==============================================================================
  library-seeder:
    image: curlimages/curl:8.11.1
    container_name: personal-library-seeder
    restart: "no"
    environment:
      - SEED_ENABLED=${SEED_ENABLED:-true}
      - SEED_API_BASE=http://personal-library-app:18080/api/v1
      - SEED_LOCAL_DIR=/seed/initial_data
      - SEED_REMOTE_PDF_URL=${SEED_REMOTE_PDF_URL:-https://cdn.bookey.app/files/pdf/book/en/the-wonderful-wizard-of-oz.pdf}
      - SEED_REMOTE_PDF_NAME=${SEED_REMOTE_PDF_NAME:-the-wonderful-wizard-of-oz.pdf}
      - SEED_MAX_TIME=${SEED_MAX_TIME:-900}
      - SEED_CERTS_DIR=/seed/certs
    volumes:
      - ./scripts/seed-initial-documents.sh:/seed/seed-initial-documents.sh:ro
      - ./initial_data:/seed/initial_data:ro
      # Same enterprise CA material the Dockerfile bakes into the app image, so
      # the HTTPS download of the remote PDF also works behind a TLS-intercepting
      # corporate proxy. Harmless (and ignored) when ./certs holds only .gitkeep.
      - ./certs:/seed/certs:ro
    entrypoint: ["/bin/sh"]
    command: ["/seed/seed-initial-documents.sh"]
    # Optional DNS override for the remote PDF download — same rationale as the
    # `ollama` service above (containers inherit the Docker daemon's resolver,
    # which may be a blocked public one). Unset by default; see LIBRARY_DNS.
    dns: ${LIBRARY_DNS:-}
    depends_on:
      personal-library-app:
        condition: service_healthy
    networks:
      - library-net

volumes:
  mongodb_data:
    name: personal-library-mongodb-data
  qdrant_data:
    name: personal-library-qdrant-data
  ollama_models:
    name: personal-library-ollama-models
  library_storage:
    name: personal-library-file-storage

networks:
  library-net:
    name: personal-library-network
    driver: bridge
